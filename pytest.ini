[pytest]
# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*

# 默认参数：-ra 输出除 pass 外所有结果的简要摘要（失败/错误/skip/xfail 原因一目了然）
addopts = -ra

# src/ 布局：让 computer_use_anywhere 可被导入，无需 pip install -e .
pythonpath = src

# 让 tests/ 下同名模块不冲突，且不依赖 __init__.py
# （importmode=importlib 需要 pytest>=6，本仓库测试均为独立模块，安全）
# import-mode = importlib

# 警告与输出
filterwarnings =
    default

# 自定义标记，便于按平台/依赖分层筛选
markers =
    windows: 依赖 Windows API（user32/ctypes/win32）的测试
    integration: 需要外部进程或网络的集成测试
    slow: 执行较慢的测试
